services:
  - type: web
    name: culyn-api
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: false
    healthCheckPath: /api/v1/health
    dockerCommand: bunx prisma migrate deploy && bun run src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: culyn-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_PUBLIC_URL_BASE
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: USER_AGENT
        sync: false
      - key: X_IG_APP_ID
        sync: false

  - type: worker
    name: culyn-worker
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: false
    dockerCommand: bun run src/worker.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: culyn-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_PUBLIC_URL_BASE
        sync: false
      - key: USER_AGENT
        sync: false
      - key: X_IG_APP_ID
        sync: false

  - type: redis
    name: culyn-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
