name: Code Quality

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest
    
    env:
      # Dummy DATABASE_URL for Prisma generate during postinstall
      # Not used for actual database connection in this workflow
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Run Prettier check
        run: bun prettier --check "**/*.{js,jsx,ts,tsx,json,css,md,prisma}"
